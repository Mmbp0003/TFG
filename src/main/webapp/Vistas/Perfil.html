<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil - BookSocial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/Perfil.css">

</head>

<body>


<div id="layout"></div>


<div id="page-content" style="display:none;">
    <div class="d-flex">


        <!-- =========================
             CONTENIDO PRINCIPAL
             ========================= -->
        <div class="flex-grow-1">


            <div class="profile-container container mt-4">

                <div class="profile-actions-top">
                    <button id="btn-seguir" class="btn btn-accent btn-sm" style="display: none;">
                        <i class="bi bi-person-plus-fill"></i> Seguir
                    </button>
                    <button id="btn-dejar-seguir" class="btn btn-outline-accent btn-sm" style="display: none;">
                        <i class="bi bi-person-dash-fill"></i> Dejar de seguir
                    </button>
                    <button id="btn-editar" class="btn btn-secondary-profile btn-sm" style="display: none;">
                        <i class="bi bi-pencil-square"></i> Editar Perfil
                    </button>
                </div>

                <div class="profile-header">
                    <div class="profile-user-info">
                        <h2 class="profile-name">Magdalena Bueno Pedrera</h2>
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <span class="profile-stat-number">42</span>
                            <span class="profile-stat-label">Leídos</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-number">12</span>
                            <span class="profile-stat-label">Este año</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-number">4.3</span>
                            <span class="profile-stat-label">Media</span>
                        </div>
                    </div>
                </div>


            </div>
                <!-- =========================
                     BODY
                     ========================= -->
                <div class="profile-body row">

                    <!-- =========================
                         IZQUIERDA (LIBROS / LISTAS)
                         ========================= -->
                    <div class="col-lg-8 profile-left">

                        <!-- LECTURAS DEL AÑO -->
                        <div class="profile-section">

                            <h5 class="profile-section-title"> Lecturas del año</h5>

                            <div class="profile-scroll-row">
                                <img src="https://m.media-amazon.com/images/I/91MsOKbHjVL.jpg" class="profile-book">

                            </div>

                        </div>


                        <div class="profile-section">

                            <h5 class="profile-section-title"> Favoritos</h5>

                            <div class="profile-scroll-row">
                                <img src="https://m.media-amazon.com/images/I/91MsOKbHjVL.jpg" class="profile-book">
                            </div>

                        </div>


                    </div>

                    <!-- =========================
                         DERECHA (SOCIAL)
                         ========================= -->
                    <div class="col-lg-4 profile-right">

                        <!-- SEGUIDORES -->
                        <div class="profile-card">

                            <h5 class="profile-card-title">Seguidores</h5>
                            <div class="profile-list">

                                <div class="profile-user-item">
                                    <i class="bi bi-person-circle fs-4 profile-avatar"></i>
                                    <span class="profile-user">usuario1</span>
                                </div>

                                <div class="profile-user-item">
                                    <i class="bi bi-person-circle fs-4 profile-avatar"></i>
                                    <span class="profile-user">usuario2</span>
                                </div>

                            </div>


                        </div>

                        <!-- SIGUIENDO -->
                        <div class="profile-card">

                            <h5 class="profile-card-title">Siguiendo</h5>

                            <div class="profile-list">

                                <div class="profile-user-item">
                                    <i class="bi bi-person-circle fs-4 profile-avatar"></i>
                                    <span class="profile-user">usuario1</span>
                                </div>

                                <div class="profile-user-item">
                                    <i class="bi bi-person-circle fs-4 profile-avatar"></i>
                                    <span class="profile-user">usuario2</span>
                                </div>

                            </div>

                        </div>

                        <!-- ACTIVIDAD -->
                        <div class="profile-card">

                            <h5 class="profile-card-title">Actividad reciente</h5>

                            <div class="profile-activity">

                                <img src="https://m.media-amazon.com/images/I/91MsOKbHjVL.jpg"
                                     class="profile-activity-img">

                                <div>
                                    <strong>El nombre del viento</strong>
                                    <p class="profile-activity-text">Valorado 5 hace 2 días</p>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script src="../js/layout.js"></script>
<script src="../js/Perfil.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
