<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/Biblioteca.css">

</head>

<body data-page="biblioteca">

<div id="layout"></div>

<div id="page-content" style="display:none;">
    <div class="d-flex">
        <div class="flex-grow-1">

            <div class="main-content">
                <div id="readingSection" class="mb-5">
                    <h3 class="section-title">Libros que estoy leyendo</h3>
                    <div class="reading-carousel-wrapper">
                        <button class="carousel-nav prev" id="prevReading"><i class="bi bi-chevron-left"></i></button>

                        <div id="readingCarouselContainer">
                        </div>

                        <button class="carousel-nav next" id="nextReading"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>

                <h3 class="section-title">Mis listas</h3>
                <div id="listasContainer"></div>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="../js/layout.js"></script>
<script src="../js/Biblioteca.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
