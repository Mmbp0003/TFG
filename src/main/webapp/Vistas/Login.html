<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Login.css">

</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">


<main class="form-signin w-100 m-auto text-center">
    <form id="loginForm" >

        <h1 class="h3 mb-3 fw-normal">Iniciar Sesión</h1>

        <div class="form-floating">
            <input type="email" class="form-control" id="floatingInput" placeholder="nombre@ejemplo.com" name="email">
            <label for="floatingInput">Correo electrónico</label>
        </div>

        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" name="clave">
            <label for="floatingPassword">Contraseña</label>
        </div>

        <div class="form-check text-start my-3">
            <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                Recordarme
            </label>
        </div>

        <button class="btn btn-primary w-100 py-2 mb-2" type="submit">Entrar</button>
        <a href="Registro.html" class="btn btn-outline-secondary w-100 py-2">Registrarse</a>

        <p class="mt-5 mb-3 text-body-secondary">© 2026</p>
    </form>
</main>


</body>

<script src="../js/login.js"></script>.
</html>
