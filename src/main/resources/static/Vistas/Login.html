<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReadBook - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Login.css">
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">

<main class="form-signin w-100 m-auto text-center">
    <form id="loginForm">

        <div class="mb-4">
            <i class="bi bi-book-half" style="font-size:2.5rem; color:#E63946;"></i>
            <h2 class="fw-bold mt-1" style="color:#2C2C2C;">ReadBook</h2>
            <p class="text-muted small">Tu comunidad lectora</p>
        </div>

        <h1 class="h3 mb-3 fw-normal">Iniciar Sesión</h1>

        <div class="form-floating">
            <input type="email" class="form-control" id="floatingInput" placeholder="nombre@ejemplo.com">
            <label for="floatingInput">Correo electrónico</label>
        </div>

        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña">
            <label for="floatingPassword">Contraseña</label>
        </div>

        <div class="form-check text-start my-3">
            <input class="form-check-input" type="checkbox" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                Recordarme
            </label>
        </div>

        <button class="btn btn-primary w-100 py-2 mb-2" type="submit">Entrar</button>

        <a href="Registro.html" class="btn btn-outline-secondary w-100 py-2">
            Registrarse
        </a>

        <p class="mt-5 mb-3 text-body-secondary">© 2026</p>
    </form>
</main>

<script src="/js/login.js"></script>

</body>
</html>
