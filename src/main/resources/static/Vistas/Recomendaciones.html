<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadBook - Recomendaciones</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="/css/Recomendaciones.css">

</head>

<body data-page="recomendaciones">

<!-- Layout dinámico -->
<div id="layout"></div>

<!-- Contenido de la página -->
<div id="app-content">

  <div id="page-content">
    <div class="main-content">

      <div class="recomendaciones-layout">

        <div class="recomendaciones-main">
          <h3 class="section-title">Recomendaciones para ti</h3>
          <div id="recomendacionesContainer" class="recomendaciones-grid">
          </div>
        </div>

        <aside class="recomendaciones-sidebar">

          <div class="filter-menu">
            <div class="toggle-filter-menu">
              <h4><span>Ordenar por</span></h4>
            </div>
            <div class="filter-form">
              <div class="filter-section">
                <div class="filter-menu-check-boxes">
                  <label class="label-filter-option-item">
                    <input type="radio" name="sort" value="title_asc" onchange="aplicarFiltrosYOrden()"> Título A-Z
                  </label>
                  <label class="label-filter-option-item">
                    <input type="radio" name="sort" value="title_desc" onchange="aplicarFiltrosYOrden()"> Título Z-A
                  </label>
                  <label class="label-filter-option-item">
                    <input type="radio" name="sort" value="autor_asc" onchange="aplicarFiltrosYOrden()"> Autor A-Z
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="filter-menu">
            <div class="toggle-filter-menu">
              <h4><span>Filtrar</span></h4>
            </div>
            <div class="filter-form">

              <h4 class="heading">Géneros</h4>
              <div class="filter-section">
                <div class="filter-menu-check-boxes" id="generosContainer">
                  <span class="text-muted small">Cargando géneros...</span>
                </div>
              </div>

              <div class="filter-actions mt-3">
                <button class="btn btn-outline-dark btn-sm w-100" onclick="resetFiltros()">Resetear todo</button>
              </div>
            </div>
          </div>

        </aside>
      </div>
    </div>
  </div>

</div>

<!-- JS -->
<script src="/js/Layout.js"></script>
<script src="/js/Recomendaciones.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
