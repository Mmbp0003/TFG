<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReadBook - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/Biblioteca.css">

</head>

<body data-page="biblioteca">

<div id="layout"></div>

<div id="page-content" style="display:none;">
    <div class="d-flex">
        <div class="flex-grow-1">

            <div class="main-content">
                <div id="readingSection" class="mb-5">
                    <h3 class="section-title">Libros que estoy leyendo</h3>
                    <div class="reading-carousel-wrapper">
                        <button class="carousel-nav prev" id="prevReading"><i class="bi bi-chevron-left"></i></button>

                        <div id="readingCarouselContainer">
                        </div>

                        <button class="carousel-nav next" id="nextReading"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>

                <h3 class="section-title">Mis listas</h3>
                <div id="listasContainer"></div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalCrearCarpeta" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Nueva lista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label text-muted small">Nombre de la lista</label>
                    <input type="text" id="inputNombreCarpeta" class="form-control"
                           placeholder="Ej: Clásicos pendientes..." maxlength="50">
                    <div id="errorNombreCarpeta" class="text-danger small mt-1" style="display:none;">
                        El nombre no puede estar vacío.
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark btn-sm" id="btnConfirmarCarpeta">
                        <i class="bi bi-folder-plus me-1"></i>Crear lista
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="/js/Layout.js"></script>
<script src="/js/Biblioteca.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
