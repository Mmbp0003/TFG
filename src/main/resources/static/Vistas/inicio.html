<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReadBook - Iniciar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Tu CSS (SIEMPRE después de Bootstrap) -->
    <link rel="stylesheet" href="/css/inicio.css">

</head>

<body>

<div id="layout"></div>

<div id="page-content" style="display:none;">
    <div class="d-flex">

        <!-- CONTENIDO + NAVBAR -->
        <div class="flex-grow-1">
            <div class="main-content">
                <!--FILTRO-->
                <div class="filter-menu">

                    <div class="toggle-filter-menu">
                        <h4><span>Filtrar libros</span></h4>
                        <span> > </span>
                    </div>

                    <div class="filter-form">

                        <!--GENERO-->
                        <h4 class="heading">GÉNEROS</h4>
                        <div class="filter-section">
                            <div class="filter-menu-check-boxes" id="generos-container">
                                <p class="text-muted small">Cargando géneros...</p>
                            </div>
                        </div>

                        <!--OPCIONES-->
                        <h4 class="heading">MÁS OPCIONES</h4>

                        <div class="filter-section">
                            <p>Rating mínimo</p>
                            <input type="number" id="rating" min="0" max="5" step="0.1" placeholder="Ej: 4.4">
                        </div>

                        <div class="filter-section">
                            <p>Número de páginas</p>
                            <div class="d-flex gap-2">
                                <input type="number" placeholder="Desde" id="words_from">
                                <input type="number" placeholder="Hasta" id="words_to">
                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="filter-actions">
                            <button onclick="getFilters()">Aplicar filtros</button>
                            <button onclick="location.reload()">Reset</button>
                        </div>

                    </div>


                </div>


                <!--Ordenar Libros-->
                <div class="filter-menu">

                    <div class="toggle-filter-menu" id="toggleSort">
                        <h4><span>Ordenar libros</span></h4>
                        <span> > </span>
                    </div>

                    <div class="filter-form" id="sortForm">

                        <div class="filter-section">
                            <p>Ordenar por</p>

                            <div class="filter-menu-check-boxes">

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="rating_desc"> Mejor valorados
                                </label>

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="rating_asc"> Peor valorados
                                </label>

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="date_desc"> Más recientes
                                </label>

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="date_asc"> Más antiguos
                                </label>

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="title_asc"> Título A-Z
                                </label>

                                <label class="label-filter-option-item">
                                    <input type="radio" name="sort" value="title_desc"> Título Z-A
                                </label>

                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="filter-actions">
                            <button onclick="applySort()">Aplicar orden</button>
                            <button onclick="resetSort()">Reset</button>
                        </div>

                    </div>


                </div>

                <br>
                <br>

                <div id="libros-container">
                    <!-- JS inserta los libros aquí -->
                </div>

            </div>
        </div>
    </div>
</div>

</div>

<div class="container">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <p class="col-md-4 mb-0 text-body-secondary">© 2025 Company, Inc</p>
        <a href="/static"
           class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
           aria-label="Bootstrap">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg>
        </a>
        <ul class="nav col-md-4 justify-content-end">
            <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Home</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Features</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Pricing</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">FAQs</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">About</a>
            </li>
        </ul>
    </footer>
</div>

</div>

</div>

<script src="/js/layout.js"></script>
<script src="/js/inicio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
