<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReadBook - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/registro.css">

</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">

<main class="form-signin w-100 m-auto text-center">

    <div class="mb-4">
        <i class="bi bi-book-half" style="font-size: 2.5rem; color: #E63946;"></i>
        <h2 class="fw-bold mt-1" style="color: #2C2C2C;">ReadBook</h2>
        <p class="text-muted small">Tu comunidad lectora</p>
    </div>

    <form id="registroForm">

        <h1 class="h3 mb-4 fw-normal">Sing Up</h1>

        <div class="form-floating mb-2">
            <input type="text" class="form-control" id="floatingNombre" placeholder="Tu nombre" name="nombre" required>
            <label for="floatingNombre">Nombre</label>
        </div>

        <div class="form-floating mb-2">
            <input type="text" class="form-control" id="floatingApellidos" placeholder="Tus apellidos" name="apellidos"
                   required>
            <label for="floatingApellidos">Apellidos</label>
        </div>

        <div class="form-floating mb-2">
            <input type="date" class="form-control" id="floatingFecha" name="fechaNacimiento" required>
            <label for="floatingFecha">Fecha de Nacimiento</label>
        </div>

        <div class="form-floating mb-2">
            <input type="email" class="form-control" id="floatingEmail" placeholder="nombre@ejemplo.com" name="email"
                   required>
            <label for="floatingEmail">Correo electrónico</label>
        </div>

        <div class="form-floating mb-4">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" name="clave"
                   required>
            <label for="floatingPassword">Contraseña</label>
        </div>

        <button class="btn btn-primary w-100 py-2 mb-3">
            Registrarme
        </button>

        <p class="text-muted">¿Ya tienes una cuenta? <a href="login.html" class="text-decoration-none">Inicia sesión
            aquí</a></p>

        <p class="mt-4 mb-3 text-body-secondary">© 2026 Mi App de Libros</p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/registro.js"></script>

</body>
</html>
